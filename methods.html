<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溝通技巧 - 聊天的方法</title>
    <style>
        :root {
            --primary-purple: #5d4e8c;
            --accent-purple: #8a78b5;
            --warm-yellow: #ffcc00;
            --glow-yellow: rgba(255, 204, 0, 0.5);
            --success-green: #2e7d32;
            --glow-green: rgba(46, 125, 50, 0.6);
            --text-dark: #222;
        }

        body { font-family: "Microsoft JhengHei", Arial, sans-serif; line-height: 1.8; color: var(--text-dark); margin: 0; padding: 0; background: #fffdf5; }

        .top-bar { 
            background: var(--primary-purple); 
            padding: 8px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            min-height: 45px;
            box-sizing: border-box;
        }
        
        .logo-container img { height: 35px; width: auto; display: block; }
        .top-bar-links { display: flex; gap: 15px; align-items: center; }
        .top-bar-links a { color: white; text-decoration: none; opacity: 0.8; font-size: 14px; }

        .hero-banner {
            background: linear-gradient(rgba(93, 78, 140, 0.75), rgba(93, 78, 140, 0.75)), url('banner-methods.jpg'); 
            background-size: cover;
            background-position: center;
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            box-sizing: border-box;
        }

        .hero-banner h1 { font-size: 3.5rem; margin: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); font-weight: bold; line-height: 1; }

        .nav-container { background: white; padding: 12px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 1000; display: flex; justify-content: center; }
        .nav-links { display: flex; list-style: none; gap: 35px; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: var(--primary-purple); font-weight: bold; font-size: 1.3rem; transition: 0.3s; }

        .container { max-width: 1400px; margin: 30px auto; padding: 0 40px; position: relative; }
        .skill-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 160px; row-gap: 180px; }
        .skill-card { background: #fff; border: 4px solid var(--warm-yellow); padding: 50px 60px; border-radius: 50px; box-shadow: 0 0 20px var(--glow-yellow); text-align: center; display: flex; flex-direction: column; justify-content: center; min-height: 300px; z-index: 1; transition: all 0.4s; box-sizing: border-box; }
        .skill-card:hover { transform: translateY(-15px) scale(1.05); box-shadow: 0 0 50px var(--warm-yellow); z-index: 5; }

        .skill-card.center-box { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); width: 520px; min-height: 280px; z-index: 10; background: #ffffff; border: 5px solid var(--success-green); box-shadow: 0 0 35px var(--glow-green); border-radius: 50px; }
        .skill-card.center-box:hover { transform: translate(-50%, -55%) scale(1.06); box-shadow: 0 0 60px var(--glow-green); }
        .skill-card h3 { color: var(--primary-purple); font-size: 2.4rem; margin-bottom: 15px; margin-top: 0; font-weight: 800; }
        .skill-card p { font-size: 1.5rem; color: #222; line-height: 1.6; margin: 0; font-weight: 600; }
        .back-btn { display: inline-block; margin: 140px 0 60px 0; padding: 20px 90px; background: var(--primary-purple); color: white; text-decoration: none; border-radius: 60px; font-weight: bold; font-size: 1.5rem; transition: 0.3s; }

        @media (max-width: 900px) { .hero-banner h1 { font-size: 2.5rem; } .skill-grid { grid-template-columns: 1fr; row-gap: 40px; } .skill-card.center-box { position: relative; transform: none; left: auto; top: auto; width: 100%; margin-top: 20px; } }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo-container"><img src="logo.png" alt="Logo"></div>
        <div class="top-bar-links"><a href="#">FB</a> <a href="#">IG</a> <a href="#">YT</a></div>
    </div>
    <header class="hero-banner"><h1>聊天的方法</h1></header>
    <div class="nav-container"><ul class="nav-links"><li><a href="index.html">主頁</a></li><li><a href="about.html">關於我們</a></li><li><a href="methods.html">溝通技巧</a></li></ul></div>
    <div class="container">
        <div class="skill-grid">
            <div class="skill-card"><h3>👂 積極傾聽</h3><p>給予對方充分的關注。在對方說話時，避免打斷或急著給建議。</p></div>
            <div class="skill-card"><h3>❓ 開放式提問</h3><p>多使用「為什麼」或「如何」來引導對話，能帶動更深層的分享。</p></div>
            <div class="skill-card"><h3>🤝 同理心反應</h3><p>試著站在對方的角度思考，理解他們當下的心情。</p></div>
            <div class="skill-card"><h3>😊 非語言訊息</h3><p>眼神交流、微笑以及放鬆的身姿，都能傳遞出願意對話的訊號。</p></div>
            <div class="skill-card center-box"><h3>💡 還有...</h3><p>想要解鎖更多聊天技巧，快點聯係我和我的團隊了解一下❤️</p></div>
        </div>
        <center><a href="index.html" class="back-btn">← 返回主頁</a></center>
    </div>
</body>
</html>
