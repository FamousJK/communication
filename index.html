<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK 交流工作坊 - 首頁</title>
    <style>
        :root {
            --primary-purple: #5d4e8c;
            --accent-purple: #8a78b5;
            --text-dark: #222;
        }

        body { font-family: "Microsoft JhengHei", Arial, sans-serif; margin: 0; background: #fffdf5; }

        /* --- Desktop Nav (Hidden on Mobile) --- */
        .nav-container { 
            background: white; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            position: sticky; top: 0; z-index: 1000; 
        }
        .nav-links { display: flex; list-style: none; gap: 40px; margin: 0; padding: 15px 20px; justify-content: center; }
        .nav-links a { text-decoration: none; color: var(--primary-purple); font-weight: bold; font-size: 1.2rem; }
        
        /* Desktop Dropdown */
        .dropdown { position: relative; }
        .dropdown-content {
            display: none; position: absolute; background: white; min-width: 150px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); border-radius: 8px; top: 100%; left: 50%; transform: translateX(-50%);
        }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a { padding: 12px; display: block; font-size: 1rem; border-bottom: 1px solid #eee; }

        /* --- Mobile Header --- */
        .mobile-header { 
            display: none; background: white; padding: 10px 20px; 
            justify-content: space-between; align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .menu-btn { font-size: 1.5rem; background: none; border: none; color: var(--primary-purple); cursor: pointer; }

        /* --- Slide-out Sidebar --- */
        .sidebar {
            position: fixed; top: 0; right: -280px; width: 280px; height: 100%;
            background: var(--primary-purple); z-index: 2000; transition: 0.3s;
            padding: 20px; box-sizing: border-box; color: white;
        }
        .sidebar.active { right: 0; }
        .sidebar-links { list-style: none; padding: 0; margin-top: 40px; }
        .sidebar-links li { margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .sidebar-links a { color: white; text-decoration: none; font-size: 1.2rem; font-weight: bold; display: block; }
        .sidebar-close { font-size: 2rem; color: white; background: none; border: none; float: right; cursor: pointer; }
        
        /* Mobile Sub-menu styling */
        .sub-menu { padding-left: 20px; margin-top: 10px; }
        .sub-menu a { font-size: 1rem; font-weight: normal; opacity: 0.9; margin-bottom: 10px; }

        /* Overlay background when menu is open */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; }
        .overlay.active { display: block; }

        /* Hero & Content */
        .hero-banner { background: var(--primary-purple); height: 180px; display: flex; justify-content: center; align-items: center; color: white; text-align: center; }
        .container { padding: 50px 20px; text-align: center; }

        /* --- Mobile Responsive Rules --- */
        @media (max-width: 768px) {
            .nav-container { display: none; } /* Hide horizontal nav */
            .mobile-header { display: flex; position: sticky; top: 0; z-index: 1000; } /* Show bar with ☰ */
        }
    </style>
</head>
<body>

    <div class="mobile-header">
        <img src="logo.png" alt="Logo" style="height: 30px;">
        <button class="menu-btn" onclick="toggleMenu()">☰ 選單</button>
    </div>

    <nav class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html">主頁</a></li>
            <li class="dropdown">
                <a href="#">關於我們 ▼</a>
                <div class="dropdown-content">
                    <a href="about.html">我們的承諾</a>
                    <a href="#">我們的服務</a>
                </div>
            </li>
            <li><a href="issue.html">溝通問題</a></li>
            <li><a href="methods.html">溝通技巧</a></li>
            <li><a href="#">聯絡我們</a></li>
        </ul>
    </nav>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <button class="sidebar-close" onclick="toggleMenu()">×</button>
        <ul class="sidebar-links">
            <li><a href="index.html">主頁</a></li>
            <li>
                <span style="font-weight: bold; color: var(--warm-yellow);">關於我們</span>
                <div class="sub-menu">
                    <a href="about.html">└ 我們的承諾</a>
                    <a href="#">└ 我們的服務</a>
                </div>
            </li>
            <li><a href="issue.html">溝通問題</a></li>
            <li><a href="methods.html">溝通技巧</a></li>
            <li><a href="#">聯絡我們</a></li>
        </ul>
    </div>

    <header class="hero-banner"><h1>交流提升工作坊</h1></header>

    <div class="container">
        <h2>用話語鏈接心靈</h2>
        <p>點擊右上角選單查看更多資訊</p>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
    </script>

</body>
</html>
