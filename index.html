<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK 交流工作坊 - 首頁</title>
    <style>
        :root {
            --primary-purple: #5d4e8c;
            --accent-purple: #8a78b5;
            --warm-yellow: #ffcc00;
            --text-dark: #222;
        }

        body { font-family: "Microsoft JhengHei", Arial, sans-serif; line-height: 1.6; color: var(--text-dark); margin: 0; padding: 0; background: #fffdf5; overflow-x: hidden; }

        /* --- Top Bar (RESTORED) --- */
        .top-bar { 
            background: var(--primary-purple); 
            padding: 8px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            min-height: 45px;
        }
        .logo-container img { height: 30px; width: auto; display: block; }
        .top-bar-links a { color: white; text-decoration: none; margin-left: 15px; font-size: 14px; opacity: 0.8; }

        /* --- Hero Banner (RESTORED) --- */
        .hero-banner {
            background: linear-gradient(rgba(93, 78, 140, 0.6), rgba(93, 78, 140, 0.6)), url('bridge-people.jpg'); 
            background-size: cover; background-position: center 35%; 
            height: 180px; display: flex; justify-content: center; align-items: center; text-align: center; color: white;
        }
        .hero-banner h1 { font-size: 2.2rem; margin: 0; padding: 0 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); font-weight: bold; }

        /* --- Navigation (RESTORED) --- */
        .nav-container { 
            background: white; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            position: sticky; top: 0; z-index: 1000; 
        }

        .nav-links { 
            display: flex; 
            list-style: none; 
            gap: 25px; 
            margin: 0; 
            padding: 15px 20px; 
            justify-content: center;
        }

        .nav-links li { position: relative; }

        .nav-links a { 
            text-decoration: none; 
            color: var(--primary-purple); 
            font-weight: bold; 
            font-size: 1.1rem; 
            transition: 0.3s; 
            white-space: nowrap;
        }

        /* --- Dropdown Logic --- */
        .dropdown-content {
            display: none; 
            position: absolute; 
            background-color: white; 
            min-width: 140px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1); 
            z-index: 1001; 
            border-radius: 8px; 
            top: 100%; left: 50%; transform: translateX(-50%);
        }

        .dropdown-content a {
            color: var(--primary-purple) !important;
            padding: 12px 16px;
            display: block;
            font-size: 1rem !important;
            text-align: center;
            font-weight: normal;
        }

        /* Desktop: Hover works perfectly */
        @media (min-width: 769px) {
            .dropdown:hover .dropdown-content { display: block; }
            .hero-banner { height: 220px; }
            .hero-banner h1 { font-size: 3.5rem; }
            .nav-links { gap: 40px; }
            .nav-links a { font-size: 1.3rem; }
        }

        /* --- MOBILE FIX (The only change) --- */
        @media (max-width: 768px) {
            .nav-container { overflow-x: auto; }
            .nav-links { justify-content: flex-start; }
            
            /* On mobile, when the menu is 'open', it pushes the content down instead of floating */
            .dropdown.mobile-open .dropdown-content { 
                display: block; 
                position: static; /* This is the fix! */
                transform: none;
                box-shadow: none;
                background: #f9f9f9;
                border-radius: 0;
                width: 100%;
            }
        }

        /* Content */
        .container { max-width: 800px; margin: 40px auto; padding: 0 30px; text-align: center; }
        .welcome-section h2 { font-size: 2rem; color: var(--primary-purple); margin-bottom: 20px; line-height: 1.3; }
        .cta-btn { display: inline-block; padding: 15px 45px; background: var(--primary-purple); color: white; text-decoration: none; border-radius: 50px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-container"><img src="logo.png" alt="Logo"></div>
        <div class="top-bar-links"><a href="#">FB</a> <a href="#">IG</a> <a href="#">YT</a></div>
    </div>

    <header class="hero-banner"><h1>交流提升工作坊</h1></header>

    <nav class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html">主頁</a></li>
            <li class="dropdown">
                <a href="#" id="about-trigger">關於我們 ▼</a>
                <div class="dropdown-content">
                    <a href="about.html">我們的承諾</a>
                    <a href="#">我們的服務</a>
                </div>
            </li>
            <li><a href="issue.html">溝通問題</a></li>
            <li><a href="methods.html">溝通技巧</a></li>
            <li><a href="#">學員見證</a></li>
            <li><a href="#">聯絡我們</a></li>
        </ul>
    </nav>

    <div class="container">
        <section class="welcome-section">
            <h2>用話語鏈接心靈的溝通</h2>
            <a href="methods.html" class="cta-btn">探索溝通技巧</a>
        </section>
    </div>

    <script>
        // Minimal script just for mobile click
        document.getElementById('about-trigger').addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                e.preventDefault();
                this.parentElement.classList.toggle('mobile-open');
            }
        });
    </script>
</body>
</html>
