<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK 交流工作坊 - 首頁</title>
    <style>
        :root {
            --primary-purple: #5d4e8c;
            --accent-purple: #8a78b5;
            --warm-yellow: #ffcc00;
            --text-dark: #222;
            --bg-light: #fffdf5;
        }

        body { font-family: "Microsoft JhengHei", Arial, sans-serif; line-height: 1.6; color: var(--text-dark); margin: 0; padding: 0; background: var(--bg-light); overflow-x: hidden; }

        /* Top Bar */
        .top-bar { background: var(--primary-purple); padding: 8px 5%; display: flex; justify-content: space-between; align-items: center; min-height: 45px; }
        .logo-container img { height: 30px; width: auto; display: block; }
        .top-bar-links a { color: white; text-decoration: none; margin-left: 15px; font-size: 14px; opacity: 0.8; }

        /* Hero */
        .hero-banner {
            background: linear-gradient(rgba(93, 78, 140, 0.6), rgba(93, 78, 140, 0.6)), url('bridge-people.jpg'); 
            background-size: cover; background-position: center 35%; 
            height: 180px; display: flex; justify-content: center; align-items: center; text-align: center; color: white;
        }
        .hero-banner h1 { font-size: 2.2rem; margin: 0; padding: 0 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); font-weight: bold; }

        /* Navigation */
        .nav-container { background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 1000; }
        .nav-links { display: flex; list-style: none; gap: 25px; margin: 0; padding: 15px 20px; justify-content: center; }
        .nav-links li { position: relative; }
        .nav-links a { text-decoration: none; color: var(--primary-purple); font-weight: bold; font-size: 1.1rem; transition: 0.3s; white-space: nowrap; }

        /* Desktop Dropdown */
        .dropdown-content {
            display: none; position: absolute; background-color: white; min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1); z-index: 1001; border-radius: 8px; 
            top: 100%; left: 50%; transform: translateX(-50%); overflow: hidden;
        }
        .dropdown-content a { color: var(--primary-purple) !important; padding: 12px 16px; display: block; font-size: 1rem !important; text-align: center; font-weight: normal; border-bottom: 1px solid #eee; }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background-color: #f8f7ff; }

        @media (min-width: 769px) {
            .dropdown:hover .dropdown-content { display: block; }
            .hero-banner { height: 220px; }
            .hero-banner h1 { font-size: 3.5rem; }
            .nav-links { gap: 40px; }
            .nav-links a { font-size: 1.3rem; }
        }

        /* Mobile Fix */
        @media (max-width: 768px) {
            .nav-container { overflow-x: auto; }
            .nav-links { justify-content: flex-start; padding-right: 50px; }
            
            .dropdown.mobile-open .dropdown-content { 
                display: block; 
                position: static; 
                transform: none; 
                box-shadow: none; 
                background: #fcfcfc;
                width: auto;
                min-width: 0;
                margin-top: 5px;
            }
            .dropdown.mobile-open .dropdown-content a {
                text-align: left; 
                padding: 10px 15px; 
                color: var(--accent-purple) !important; 
                font-weight: bold;
            }
        }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .welcome-section h2 { font-size: 2.2rem; color: var(--primary-purple); margin-bottom: 15px; }
        
        /* Service Preview Cards */
        .service-preview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .preview-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .preview-card:hover { transform: translateY(-5px); }
        .preview-card h3 { color: var(--primary-purple); margin-top: 0; }
        
        .cta-btn { display: inline-block; padding: 15px 45px; background: var(--primary-purple); color: white; text-decoration: none; border-radius: 50px; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        .cta-btn:hover { background: var(--accent-purple); box-shadow: 0 4px 12px rgba(93, 78, 140, 0.3); }
        
        footer { margin-top: 60px; padding: 30px; background: #f0eeff; color: var(--primary-purple); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-container"><img src="logo.png" alt="Logo"></div>
        <div class="top-bar-links"><a href="#">FB</a> <a href="#">IG</a> <a href="#">YT</a></div>
    </div>

    <header class="hero-banner">
        <h1>交流提升工作坊</h1>
    </header>

    <nav class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html">主頁</a></li>
            <li class="dropdown">
                <a href="#" class="trigger">關於我們 ▼</a>
                <div class="dropdown-content">
                    <a href="about.html">我們的承諾</a>
                    <a href="service.html">我們的服務</a>
                </div>
            </li>
            <li><a href="issue.html">溝通問題</a></li>
            <li><a href="methods.html">溝通技巧</a></li>
            <li><a href="#">學員見證</a></li>
            <li><a href="#">聯絡我們</a></li>
        </ul>
    </nav>

    <div class="container">
        <section class="welcome-section">
            <h2>用話語鏈接心靈的溝通</h2>
            <p>打破人際隔閡，從了解自我性格開始。我們提供全方位的溝通解決方案。</p>
            
            <div class="service-preview">
                <div class="preview-card">
                    <h3>MBTI 分析</h3>
                    <p>由 AI 顧問「小S」為您進行免費的人格類型溝通評估。</p>
                </div>
                <div class="preview-card">
                    <h3>技巧教學</h3>
                    <p>系統化拆解溝通流、問題識別與軟硬技巧應用。</p>
                </div>
                <div class="preview-card">
                    <h3>1對1 諮詢</h3>
                    <p>針對職場、情感與社交關係提供專屬客製化方案。</p>
                </div>
            </div>

            <a href="service.html" class="cta-btn">探索完整服務</a>
        </section>
    </div>

    <footer>
        &copy; 2026 JK 交流工作坊. All rights reserved.
    </footer>

    <script>
        // Toggle dropdown on mobile
        document.querySelectorAll('.trigger').forEach(el => {
            el.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) { 
                    e.preventDefault(); 
                    this.parentElement.classList.toggle('mobile-open'); 
                }
            });
        });

        // Ensure links inside dropdown work correctly
        document.querySelectorAll('.dropdown-content a').forEach(link => {
            link.addEventListener('click', function() {
                window.location.href = this.getAttribute('href');
            });
        });
    </script>
</body>
</html>
