<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK 交流工作坊 - 首頁</title>
    <style>
        :root {
            --primary-purple: #5d4e8c;
            --accent-purple: #8a78b5;
            --warm-yellow: #ffcc00;
            --text-dark: #222;
        }

        body { 
            font-family: "Microsoft JhengHei", Arial, sans-serif; 
            line-height: 1.6; 
            color: var(--text-dark); 
            margin: 0; padding: 0; 
            background: #fffdf5; 
            overflow-x: hidden; 
        }

        /* Top Bar */
        .top-bar { 
            background: var(--primary-purple); 
            padding: 8px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            min-height: 45px;
        }
        .logo-container img { height: 30px; width: auto; display: block; }
        .top-bar-links a { color: white; text-decoration: none; margin-left: 15px; font-size: 14px; opacity: 0.8; }

        /* Hero Banner */
        .hero-banner {
            background: linear-gradient(rgba(93, 78, 140, 0.6), rgba(93, 78, 140, 0.6)), url('bridge-people.jpg'); 
            background-size: cover;
            background-position: center 35%; 
            height: 180px; 
            display: flex; justify-content: center; align-items: center; text-align: center; color: white;
        }
        .hero-banner h1 { font-size: 2.2rem; margin: 0; padding: 0 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); font-weight: bold; }

        /* Navigation - Restored Dropdown Logic */
        .nav-container { 
            background: white; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }

        .nav-links { 
            display: flex; 
            list-style: none; 
            gap: 25px; 
            margin: 0; 
            padding: 15px 20px; 
            justify-content: center; /* Centered for Desktop */
        }

        .nav-links li { position: relative; } /* Anchor for dropdown */

        .nav-links a { 
            text-decoration: none; 
            color: var(--primary-purple); 
            font-weight: bold; 
            font-size: 1.1rem; 
            transition: 0.3s; 
            white-space: nowrap;
        }

        .nav-links a:hover { color: var(--warm-yellow); }

        /* Dropdown Styling */
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 140px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
            z-index: 1001;
            border-radius: 8px;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
        }

        .dropdown-content a {
            color: var(--primary-purple) !important;
            padding: 12px 16px;
            display: block;
            font-size: 1rem !important;
            text-align: center;
            font-weight: normal;
        }

        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a:hover { background-color: #f8f8f8; color: var(--warm-yellow) !important; }

        /* Main Content */
        .container { max-width: 800px; margin: 40px auto; padding: 0 30px; text-align: center; }
        .welcome-section h2 { font-size: 2rem; color: var(--primary-purple); margin-bottom: 20px; line-height: 1.3; }
        .welcome-section p { font-size: 1.1rem; color: #444; margin-bottom: 40px; }
        .cta-btn { display: inline-block; padding: 15px 45px; background: var(--primary-purple); color: white; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 1.2rem; transition: 0.3s; box-shadow: 0 8px 15px rgba(93, 78, 140, 0.2); }
        .cta-btn:hover { background: var(--accent-purple); transform: translateY(-3px); }

        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            .nav-container { overflow-x: auto; } /* Allow swipe */
            .nav-links { justify-content: flex-start; } /* Align left for swiping */
            .dropdown:hover .dropdown-content { display: none; } /* Disable hover on mobile to prevent accidental clicks */
            /* Note: On mobile, you might want to link "關於我們" directly to a page or use a click-trigger */
        }

        @media (min-width: 768px) {
            .hero-banner { height: 220px; }
            .hero-banner h1 { font-size: 3.5rem; }
            .nav-links { gap: 40px; }
            .nav-links a { font-size: 1.3rem; }
            .welcome-section h2 { font-size: 2.8rem; }
            .container { margin: 80px auto; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-container"><img src="logo.png" alt="Logo"></div>
        <div class="top-bar-links">
            <a href="#">FB</a> <a href="#">IG</a> <a href="#">YT</a>
        </div>
    </div>

    <header class="hero-banner">
        <h1>交流提升工作坊</h1>
    </header>

    <nav class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html">主頁</a></li>

            <li class="dropdown">
                <a href="#" style="cursor: default;">關於我們 ▼</a>
                <div class="dropdown-content">
                    <a href="about.html">我們的承諾</a>
                    <a href="#">我們的服務</a>
                </div>
            </li>

            <li><a href="issue.html">溝通問題</a></li>
            <li><a href="methods.html">溝通技巧</a></li>
            <li><a href="#">學員見證</a></li>
            <li><a href="#">聯絡我們</a></li>
        </ul>
    </nav>

    <div class="container">
        <section class="welcome-section">
            <h2>用話語鏈接心靈的溝通，<br>你真的懂嗎？</h2>
            <p>用心聽，大聲說。在這裡我們一起探索提升關係的說話藝術。</p>
            <a href="methods.html" class="cta-btn">探索溝通技巧</a>
        </section>
    </div>

</body>
</html>
