<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK 交流工作坊 - 首頁</title>
    <style>
        :root {
            --primary-purple: #5d4e8c;
            --accent-purple: #8a78b5;
            --text-dark: #222;
        }

        body { font-family: "Microsoft JhengHei", Arial, sans-serif; line-height: 1.6; margin: 0; background: #fffdf5; }

        /* Navigation Layout */
        .nav-container { background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 1000; }
        .nav-links { display: flex; list-style: none; gap: 25px; margin: 0; padding: 15px 20px; justify-content: center; align-items: center; }
        .nav-links li { position: relative; }
        .nav-links a, .dropdown-label { text-decoration: none; color: var(--primary-purple); font-weight: bold; font-size: 1.1rem; cursor: pointer; display: block; }

        /* Hidden Checkbox for Mobile Toggle */
        #menu-toggle { display: none; }

        /* Dropdown Styling */
        .dropdown-content {
            display: none; position: absolute; background-color: white; min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1); border-radius: 8px; top: 100%; left: 50%; transform: translateX(-50%);
        }
        .dropdown-content a { color: var(--primary-purple); padding: 12px 16px; font-weight: normal; font-size: 1rem; text-align: center; border-bottom: 1px solid #eee; }
        .dropdown-content a:last-child { border-bottom: none; }

        /* Desktop: Hover Logic */
        @media (min-width: 769px) {
            .dropdown:hover .dropdown-content { display: block; }
        }

        /* Mobile: Click/Toggle Logic */
        @media (max-width: 768px) {
            .nav-container { overflow-x: auto; white-space: nowrap; }
            .nav-links { justify-content: flex-start; padding: 15px 10px; }
            
            /* When checkbox is checked, show menu */
            #menu-toggle:checked ~ .dropdown-content { 
                display: block; 
                position: absolute;
                top: 40px; 
            }
            
            /* Visual feedback when tapped */
            .dropdown-label:active { opacity: 0.6; }
        }

        /* Hero & Content (Same as before) */
        .hero-banner { background: var(--primary-purple); height: 180px; display: flex; justify-content: center; align-items: center; color: white; }
        .container { text-align: center; padding: 50px 20px; }
    </style>
</head>
<body>
    <header class="hero-banner"><h1>交流提升工作坊</h1></header>

    <nav class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html">主頁</a></li>
            
            <li class="dropdown">
                <label for="menu-toggle" class="dropdown-label">關於我們 ▼</label>
                <input type="checkbox" id="menu-toggle">
                
                <div class="dropdown-content">
                    <a href="about.html">我們的承諾</a>
                    <a href="#">我們的服務</a>
                </div>
            </li>

            <li><a href="issue.html">溝通問題</a></li>
            <li><a href="methods.html">溝通技巧</a></li>
            <li><a href="#">聯絡我們</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>用話語鏈接心靈的溝通</h2>
    </div>

    <script>
        // Optional: Close menu if clicking outside
        document.addEventListener('click', function(e) {
            const checkbox = document.getElementById('menu-toggle');
            const dropdown = document.querySelector('.dropdown');
            if (!dropdown.contains(e.target) && checkbox.checked) {
                checkbox.checked = false;
            }
        });
    </script>
</body>
</html>
