<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溝通問題 - 溝通中的挑戰</title>
    <style>
        :root {
            --primary-purple: #5d4e8c;
            --accent-purple: #8a78b5;
            --warm-yellow: #ffcc00;
            --issue-red: #d32f2f;
            --text-dark: #222;
        }

        body { font-family: "Microsoft JhengHei", Arial, sans-serif; line-height: 1.6; color: var(--text-dark); margin: 0; padding: 0; background: #fffdf5; overflow-x: hidden; }

        /* Top Bar */
        .top-bar { background: var(--primary-purple); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo-container img { height: 30px; width: auto; }
        .top-bar-links a { color: white; text-decoration: none; margin-left: 10px; font-size: 14px; }

        /* Hero Banner */
        .hero-banner {
            background: linear-gradient(rgba(93, 78, 140, 0.75), rgba(93, 78, 140, 0.75)), url('issue-question.jpg'); 
            background-size: cover;
            background-position: center 10%; 
            height: 120px; 
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .hero-banner h1 { font-size: 2rem; margin: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }

        /* Nav */
        .nav-container { background: white; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000; overflow-x: auto; }
        .nav-links { display: flex; list-style: none; gap: 20px; margin: 0; padding: 15px; white-space: nowrap; justify-content: center; }
        .nav-links a { text-decoration: none; color: var(--primary-purple); font-weight: bold; }

        /* The Centering Fix */
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        
        .skill-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            align-items: center; /* This pulls everything to the center */
        }

        .skill-card { 
            background: #fff; 
            border: 3px solid #ffa726; 
            padding: 30px; 
            border-radius: 30px; 
            text-align: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            width: 100%; /* Important for mobile */
            max-width: 600px; /* Prevents it from getting too wide on desktop */
            box-sizing: border-box;
        }

        .skill-card.center-box { 
            border-color: var(--issue-red); 
            background: #fff5f5;
            order: -1; /* Keeps the "Question" box at the top */
        }

        .skill-card h3 { color: var(--primary-purple); font-size: 1.5rem; margin-top: 0; }
        .skill-card p { font-size: 1rem; color: #555; margin-bottom: 0; }

        .back-btn-container { text-align: center; margin: 40px 0; }
        .back-btn { 
            display: inline-block; 
            padding: 12px 40px; 
            background: var(--primary-purple); 
            color: white; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: bold; 
        }

        /* Desktop Adjustments */
        @media (min-width: 768px) {
            .hero-banner h1 { font-size: 2.8rem; }
            .skill-card:hover { transform: translateY(-5px); transition: 0.3s; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo-container"><img src="logo.png" alt="Logo"></div>
        <div class="top-bar-links"><a href="#">FB</a> <a href="#">IG</a></div>
    </div>

    <header class="hero-banner"><h1>溝通的絆腳石</h1></header>

    <nav class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html">主頁</a></li>
            <li><a href="about.html">關於我們</a></li>
            <li><a href="issue.html">溝通問題</a></li>
            <li><a href="methods.html">交流技巧</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="skill-grid">
            <div class="skill-card center-box">
                <h3>💔 你也有這些困擾嗎？</h3>
                <p>溝通問題往往來自細微的習慣。讓我們陪你找出核心原因，重建心靈的橋樑。</p>
            </div>

            <div class="skill-card">
                <h3>🤐 陷入「尬聊」</h3>
                <p>明明想聊天卻找不到話題，空氣突然安靜，讓雙方都感到巨大的壓力。</p>
            </div>
            
            <div class="skill-card">
                <h3>🗣️ 只有我在說</h3>
                <p>不小心變成單向輸出，忽略了對方的反應，導致對話失去互動與溫度。</p>
            </div>
            
            <div class="skill-card">
                <h3>🙅 習慣性否定</h3>
                <p>當對方分享時，下意識用「可是...」來回應，無形中澆熄了對方的熱情。</p>
            </div>
            
            <div class="skill-card">
                <h3>📱 數位屏障</h3>
                <p>過度依賴冷冰冰的文字，少了表情與語氣的傳遞，容易產生不必要的誤會。</p>
            </div>
        </div>

        <div class="back-btn-container">
            <a href="index.html" class="back-btn">← 返回主頁</a>
        </div>
    </div>
</body>
</html>
