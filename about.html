<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於我們 - 溝通的意義</title>
    <style>
        :root {
            --primary-purple: #5d4e8c;
            --accent-purple: #8a78b5;
            --warm-yellow: #ffcc00;
            --glow-yellow: rgba(255, 204, 0, 0.4);
            --soft-bg: #fffdf5;
            --text-dark: #222;
        }

        body { font-family: "Microsoft JhengHei", Arial, sans-serif; line-height: 1.8; color: var(--text-dark); margin: 0; padding: 0; background: var(--soft-bg); overflow-x: hidden; }

        /* Top Bar */
        .top-bar { background: var(--primary-purple); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo-container img { height: 45px; width: auto; }
        .top-links a { color: white; text-decoration: none; margin-left: 15px; font-size: 14px; opacity: 0.8; }

        /* Banner */
        .hero-banner {
            background: linear-gradient(rgba(93, 78, 140, 0.7), rgba(93, 78, 140, 0.7)), url('bridge-people.jpg');
            background-size: cover; background-position: center 30%; height: 220px;
            display: flex; justify-content: center; align-items: center; color: white;
        }
        .hero-banner h1 { font-size: 3.5rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.3); }

        /* Nav */
        .nav-container { background: white; padding: 15px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; display: flex; justify-content: center; }
        .nav-links { display: flex; list-style: none; gap: 40px; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: var(--primary-purple); font-weight: bold; font-size: 1.2rem; }

        /* Story Layout Container */
        .story-container { 
            max-width: 1200px; 
            margin: 60px auto; 
            padding: 0 20px; 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Card Row for Parallel Effect */
        .card-row {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .story-card {
            background: white;
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            border: 4px solid var(--warm-yellow);
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex: 1; /* Makes cards equal width in a row */
            min-width: 450px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Hover Effect */
        .story-card:hover {
            transform: translateY(-15px) scale(1.03);
            box-shadow: 0 20px 40px var(--glow-yellow);
            z-index: 10;
        }

        /* Color Variations */
        .border-purple { border-color: var(--accent-purple); }
        .border-green { border-color: #2e7d32; }

        .story-card h2 { color: var(--primary-purple); font-size: 2.2rem; margin-top: 0; margin-bottom: 15px; }
        
        /* Unified Font Sizes */
        .story-card p, .story-card li { 
            font-size: 1.4rem; 
            font-weight: 600; 
            line-height: 1.6;
        }
        
        .story-card ul { 
            margin: 0; 
            padding-left: 25px; 
        }

        .back-btn-container { text-align: center; margin: 80px 0; }
        .back-btn { 
            padding: 20px 80px; background: var(--primary-purple); color: white; 
            text-decoration: none; border-radius: 60px; font-weight: bold; font-size: 1.4rem;
            transition: 0.3s;
        }
        .back-btn:hover { background: var(--accent-purple); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }

        @media (max-width: 900px) {
            .story-card { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-container"><img src="logo.png" alt="Logo"></div>
        <div class="top-links"><a href="#">FB</a><a href="#">IG</a><a href="#">YT</a></div>
    </div>

    <header class="hero-banner"><h1>關於我們</h1></header>

    <nav class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html">主頁</a></li>
            <li><a href="about.html">關於我們</a></li>
            <li><a href="methods.html">溝通技巧</a></li>
        </ul>
    </nav>

    <div class="story-container">
        <div class="card-row">
            <div class="story-card">
                <h2>🌱 我們的初衷</h2>
                <p>在快節奏的現代生活中，我們往往學會了說話，卻忘記了如何「溝通」。建立這個平台的初衷，讓大家重新學習如何表達需求。</p>
            </div>
            <div class="story-card border-purple">
                <h2>💎 溝通的意義</h2>
                <p>溝通不僅是訊息的傳遞，更是心靈的連結。透過有效的溝通，將衝突轉化為彼此理解的契機。</p>
            </div>
        </div>

        <div class="card-row">
            <div class="story-card border-purple">
                <h2>🚀 學習的益處</h2>
                <ul>
                    <li>理解溝通四大流程。</li>
                    <li>在各種環境下更自信表達。</li>
                    <li>提升情緒管理，減少爭吵。</li>
                </ul>
            </div>

            <div class="story-card border-green">
                <h2>🤝 如何幫助他人？</h2>
                <p>我們關注在人際關係中感到孤立的群體。透過對話與互動，找回連結的勇氣，讓自己變得更有安全感與自信。</p>
            </div>
        </div>
    </div>

    <div class="back-btn-container">
        <a href="index.html" class="back-btn">← 返回主頁</a>
    </div>

</body>
</html>
