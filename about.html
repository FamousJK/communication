<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於我們 - 溝通的意義</title>
    <style>
        :root {
            --primary-purple: #5d4e8c;
            --accent-purple: #8a78b5;
            --warm-yellow: #ffcc00;
            --glow-yellow: rgba(255, 204, 0, 0.4);
            --soft-bg: #fffdf5;
            --text-dark: #222;
        }

        body { font-family: "Microsoft JhengHei", Arial, sans-serif; line-height: 1.8; color: var(--text-dark); margin: 0; padding: 0; background: var(--soft-bg); overflow-x: hidden; }

        /* Consistent Header */
        .top-bar { background: var(--primary-purple); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo-container img { height: 45px; width: auto; }
        .top-links a { color: white; text-decoration: none; margin-left: 15px; font-size: 14px; opacity: 0.8; }

        .hero-banner {
            background: linear-gradient(rgba(93, 78, 140, 0.7), rgba(93, 78, 140, 0.7)), url('bridge-people.jpg');
            background-size: cover; background-position: center 30%; height: 220px;
            display: flex; justify-content: center; align-items: center; color: white;
        }
        .hero-banner h1 { font-size: 3.5rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.3); }

        .nav-container { background: white; padding: 15px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; display: flex; justify-content: center; }
        .nav-links { display: flex; list-style: none; gap: 40px; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: var(--primary-purple); font-weight: bold; font-size: 1.2rem; }

        /* Story Container */
        .story-container { 
            max-width: 1100px; /* Narrowed slightly to bring things inward */
            margin: 40px auto; 
            padding: 0 20px; 
            display: flex;
            flex-direction: column;
        }

        /* The Row Layout - Tightened */
        .story-row {
            display: flex;
            align-items: center;
            justify-content: center; /* Center them to pull them toward each other */
            gap: 30px; /* Reduced gap to bring photo closer to box */
            margin-bottom: -70px; /* Overlap effect */
            position: relative;
        }

        /* Equal Size Cards */
        .story-card {
            background: white;
            padding: 45px;
            border-radius: 50px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.06);
            border: 4px solid var(--warm-yellow);
            width: 580px; /* Slightly narrowed for a snugger fit */
            height: 340px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            z-index: 5;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .story-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 50px var(--glow-yellow);
            z-index: 20;
        }

        /* Side Images - Tightened */
        .side-image {
            width: 400px;
            height: 280px;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 1;
            flex-shrink: 0; /* Prevents image from squishing */
        }

        .side-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Alternate Positioning */
        .row-reverse { flex-direction: row-reverse; }
        .border-purple { border-color: var(--accent-purple); }
        .border-green { border-color: #2e7d32; }

        .story-card h2 { color: var(--primary-purple); font-size: 2.1rem; margin-top: 0; margin-bottom: 12px; font-weight: 800; }
        .story-card p, .story-card ul li { 
            font-size: 1.35rem; 
            font-weight: 600; 
            line-height: 1.5; 
            color: #333;
            margin: 0;
        }
        .story-card ul { padding-left: 25px; margin: 0; }

        /* Final Box */
        .card-final-wrap { display: flex; justify-content: center; margin-top: 60px; width: 100%; }

        .back-btn-container { text-align: center; margin: 100px 0 80px 0; }
        .back-btn { 
            padding: 18px 70px; background: var(--primary-purple); color: white; 
            text-decoration: none; border-radius: 60px; font-weight: bold; font-size: 1.3rem;
        }

        @media (max-width: 1000px) {
            .story-row, .row-reverse { flex-direction: column; margin-bottom: 30px; gap: 15px; }
            .story-card { width: 100%; height: auto; min-height: 280px; }
            .side-image { width: 100%; height: 220px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-container"><img src="logo.png" alt="Logo"></div>
        <div class="top-links"><a href="#">FB</a><a href="#">IG</a><a href="#">YT</a></div>
    </div>

    <header class="hero-banner"><h1>關於我們</h1></header>

    <nav class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html">主頁</a></li>
            <li><a href="about.html">關於我們</a></li>
            <li><a href="methods.html">溝通技巧</a></li>
        </ul>
    </nav>

    <div class="story-container">
        <div class="story-row">
            <div class="story-card">
                <h2>🌱 我們的初衷</h2>
                <p>在快節奏的現代生活中，我們往往學會了說話，卻忘記了如何「溝通」。希望提供一個溫暖的空間，讓大家重新學習如何表達需求。</p>
            </div>
            <div class="side-image">
                <img src="about-intent.jpg" alt="Intention">
            </div>
        </div>

        <div class="story-row row-reverse">
            <div class="story-card border-purple">
                <h2>💎 溝通的意義</h2>
                <p>溝通不僅是訊息的傳遞，更是心靈的連結。透過有效的溝通，將衝突轉化為彼此理解的契機。</p>
            </div>
            <div class="side-image">
                <img src="about-purpose.jpg" alt="Purpose">
            </div>
        </div>

        <div class="story-row">
            <div class="story-card">
                <h2>🚀 學習的益處</h2>
                <ul>
                    <li>理解溝通四大流程。</li>
                    <li>在各種環境下更自信表達。</li>
                    <li>提升情緒管理，減少爭吵。</li>
                </ul>
            </div>
            <div class="side-image">
                <img src="about-connect.jpg" alt="Connect">
            </div>
        </div>

        <div class="card-final-wrap">
            <div class="story-card border-green" style="width: 750px; text-align: center;">
                <h2>🤝 幫助有需要的人</h2>
                <p>我們特別關注人際關係中感到孤立的群體。透過連結與互動，讓自己變得更有安全感與自我肯定，進而提升自信心。</p>
            </div>
        </div>
    </div>

    <div class="back-btn-container">
        <a href="index.html" class="back-btn">← 返回主頁</a>
    </div>

</body>
</html>
