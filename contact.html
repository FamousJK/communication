<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 - 終結溝通困境</title>
    <style>
        :root {
            --primary-navy: #2c3e50;
            --accent-blue: #3498db;
            --soft-blue: #f0f7ff;
            --issue-red: red;
            --success-green: #27ae60;
            --text-dark: #333;
            --bg-light: #f9f9f9;
        }

        body { 
            font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; 
            line-height: 1.6; 
            color: var(--text-dark); 
            margin: 0; padding: 0; 
            background: var(--bg-light); 
            overflow-x: hidden; 
        }

        /* Top Bar */
        .top-bar { 
            background: var(--primary-navy); 
            padding: 8px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            min-height: 45px;
        }
        .logo-container img { height: 30px; width: auto; display: block; }
        .top-bar-links a { color: white; text-decoration: none; margin-left: 15px; font-size: 14px; opacity: 0.8; }

        /* Hero Banner - Synced */
        .hero-banner {
            background: linear-gradient(rgba(44, 62, 80, 0.8), rgba(44, 62, 80, 0.8)), url('contact-hero.jpg'); 
            background-size: cover;
            background-position: center; 
            height: 130px; 
            display: flex; justify-content: center; align-items: center; color: white; text-align: center;
        }
        .hero-banner h1 { font-size: 1.8rem; margin: 0; font-weight: bold; text-shadow: 2px 2px 10px rgba(0,0,0,0.3); }

        /* Navigation */
        .nav-container { 
            background: white; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            position: sticky; top: 0; z-index: 1000; 
            overflow-x: auto;
        }
        .nav-links { 
            display: flex; list-style: none; gap: 25px; margin: 0 auto; padding: 0 20px; 
            justify-content: center; width: max-content;
        }
        .nav-links a { 
            text-decoration: none; color: var(--primary-navy); font-weight: bold; font-size: 1.1rem; 
            display: block; padding: 15px 5px; transition: 0.3s; border-bottom: 3px solid transparent; 
        }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-blue); border-bottom: 3px solid #bdc3c7; }

        /* Layout Container */
        .contact-container { 
            max-width: 1100px; margin: 40px auto; padding: 0 20px; 
        }

        .contact-wrapper {
            display: flex; flex-direction: column; 
            background: white; border-radius: 15px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Left Side Text Content */
        .contact-info { padding: 40px; flex: 1.2; border-left: 5px solid var(--accent-blue); }
        
        .contact-info h2 { 
            color: var(--primary-navy); 
            font-size: 1.8rem; 
            margin-top: 0; 
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent-blue); 
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Main Text Size - Matched to issue.html */
        .contact-info p { 
            font-size: 1.4rem; 
            line-height: 1.7; 
            color: #555; 
            margin-bottom: 25px; 
        }
        
        /* Stressful words styling */
        .stress-text { color: var(--issue-red); font-weight: bold; }
        .solution-text { color: var(--success-green); font-weight: bold; }

        /* Right Side Image Placeholder */
        .contact-image { 
            flex: 0.8; background: #eef2f5; 
            display: flex; align-items: center; justify-content: center; 
            min-height: 400px;
        }
        .contact-image img { width: 100%; height: 100%; object-fit: cover; }

        /* List Styling */
        .contact-details { list-style: none; padding: 0; margin: 30px 0; }
        .contact-details li { font-size: 1.4rem; margin-bottom: 15px; color: #444; }
        .contact-details strong { color: var(--primary-navy); width: 110px; display: inline-block; }

        /* CTA Button */
        .cta-btn {
            display: inline-block; background: var(--success-green); color: white; 
            padding: 18px 45px; border-radius: 10px; text-decoration: none; 
            font-weight: bold; font-size: 1.4rem; transition: 0.3s;
            border: none; cursor: pointer;
        }
        .cta-btn:hover { background: #219150; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(39, 174, 96, 0.3); }

        /* Desktop Adjustments */
        @media (min-width: 769px) {
            .hero-banner { height: 250px; }
            .hero-banner h1 { font-size: 3.5rem; }
            .nav-links { gap: 40px; }
            .nav-links a { font-size: 1.3rem; }
            .contact-wrapper { flex-direction: row; }
            .contact-info { padding: 60px; }
        }

        /* Back Button */
        .back-btn-container { text-align: center; margin: 60px 0; }
        .back-btn { 
            display: inline-block; padding: 18px 60px; background: var(--primary-navy); 
            color: white; text-decoration: none; border-radius: 12px; font-weight: bold; 
            font-size: 1.4rem; transition: 0.3s; border: 2px solid var(--primary-navy);
        }
        .back-btn:hover { background: var(--accent-blue); border-color: var(--accent-blue); transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-container"><img src="logo.png" alt="Logo"></div>
        <div class="top-bar-links">
            <a href="#">小紅書</a> <a href="#">IG</a> <a href="#">YT</a>
        </div>
    </div>

    <header class="hero-banner"><h1>終結溝通内耗</h1></header>

    <nav class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html">品牌首頁</a></li>
            <li><a href="about.html">核心理念</a></li>
            <li><a href="issue.html">溝通問題</a></li>
            <li><a href="service.html">方案+服務</a></li>            
            <li><a href="testi.html">學員回饋</a></li>
            <li><a href="contact.html" class="active">聯絡我們</a></li>
        </ul>
    </nav>

    <div class="contact-container">
        <div class="contact-wrapper">
            <div class="contact-info">
                <h2>立即啟動 核心轉化方案</h2>
                
                <p>
                    別再<span class="stress-text">内耗</span>,讓<span class="stress-text">「誤解」</span>與<span class="stress-text">「無效溝通」</span>。<br>
                    如果您正因為關係中的沈默、尷尬或毫無進展感到<span class="stress-text">焦慮</span>...
                </p>

                <p style="border-left: 4px solid var(--accent-blue); padding-left: 20px; margin: 30px 0; color: #333;">
                    <strong style="color: var(--primary-navy);">JK 導師</strong> 將協助您診斷<span class="stress-text">溝通問題</span>，<br>
                    重構底層邏輯，將您的<span class="stress-text">社交內耗</span>轉化為<span class="solution-text">精準影響力</span>。
                </p>
                
                <ul class="contact-details">
                    <li><strong>官方 LINE</strong> @jk_workshop</li>
                    <li><strong>電子郵件</strong> contact@jk-comm.com</li>
                    <li><strong>諮詢時段</strong> 週一至週五 10:00 - 20:00</li>
                </ul>

                <a href="https://line.me" class="cta-btn">立即加入 LINE 預約諮詢</a>
            </div>

            <div class="contact-image">
                <img src="consultant.jpg" alt="JK 導師" onerror="this.parentElement.innerHTML='<p style=\'color:#999; font-weight:bold;\'>[ 此處放置導師形象照 ]</p>'">
            </div>
        </div>
    </div>

    <div class="back-btn-container">
        <a href="index.html" class="back-btn">← 返回首頁</a>
    </div>

</body>
</html>
