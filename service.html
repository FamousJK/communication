<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>我們的服務 - JK 交流工作坊</title>
    <style>
        :root {
            --primary-navy: #2c3e50;
            --accent-blue: #3498db;
            --soft-blue: #f0f7ff;
            --success-green: #27ae60;
            --ai-gradient: linear-gradient(135deg, #3498db, #27ae60);
            --warm-bg: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            --text-dark: #333;
            --bg-light: #f9f9f9;
        }

        body { font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; line-height: 1.6; color: var(--text-dark); margin: 0; padding: 0; background: var(--bg-light); }

        /* Navigation & Hero (保持一致) */
        .top-bar { background: var(--primary-navy); padding: 8px 5%; display: flex; justify-content: space-between; align-items: center; min-height: 45px; }
        .logo-container img { height: 30px; }
        .top-bar-links a { color: white; text-decoration: none; margin-left: 15px; font-size: 14px; opacity: 0.8; }
        .hero-banner { background: linear-gradient(rgba(44, 62, 80, 0.8), rgba(44, 62, 80, 0.8)), url('service-banner.jpg'); background-size: cover; background-position: center 25%; height: 180px; display: flex; justify-content: center; align-items: center; color: white; }
        .nav-container { background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 1000; }
        .nav-links { display: flex; list-style: none; gap: 25px; margin: 0; padding: 15px 20px; justify-content: center; }
        .nav-links a { text-decoration: none; color: var(--primary-navy); font-weight: bold; }

        /* Container Content */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .service-box { background: white; padding: 30px; border-radius: 15px; border-left: 5px solid var(--accent-blue); margin-bottom: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* 小S Floating Avatar */
        .ai-doll-trigger {
            position: fixed; bottom: 25px; right: 25px; width: 85px; height: 85px; cursor: pointer; z-index: 2000;
        }
        .ai-doll-trigger img {
            width: 100%; height: 100%; border-radius: 50%; border: 4px solid white; box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            background: var(--warm-bg); object-fit: contain; padding: 5px; box-sizing: border-box;
        }

        /* Chat Window */
        .chat-window {
            position: fixed; bottom: 120px; right: 25px; width: 360px; height: 550px;
            background: white; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            display: none; flex-direction: column; z-index: 2100; overflow: hidden;
        }

        @media (max-width: 600px) {
            .chat-window { width: 100%; height: 100%; bottom: 0; right: 0; border-radius: 0; }
        }

        .chat-header { background: var(--ai-gradient); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .restart-btn { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 3px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }

        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; background: #fcfcfc; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; }
        .msg.ai { background: #f0f2f5; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg.user { background: var(--accent-blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

        .mode-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .mode-btn { background: white; border: 1px solid var(--accent-blue); color: var(--accent-blue); padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }

        .chat-input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white; }
        .chat-input-area input { flex: 1; padding: 12px 15px; border: 2px solid #ddd; border-radius: 25px; font-size: 16px; outline: none; }
        .chat-input-area input:focus { border-color: var(--accent-blue); }
        .send-btn { background: var(--accent-blue); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }

        /* Report Overlay */
        .assessment-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 2200; display: none;
            flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-container"><img src="logo.png" alt="Logo"></div>
        <div class="top-bar-links"><a href="#">FB</a><a href="#">IG</a><a href="#">YT</a></div>
    </div>

    <header class="hero-banner"><h1>我們的服務</h1></header>
    
    <nav class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html">主頁</a></li>
            <li><a href="about.html">關於我們</a></li>
            <li><a href="issue.html">溝通問題</a></li>
            <li><a href="service.html" style="color:var(--accent-blue)">我們的服務</a></li>
        </ul>
    </nav>

    <div class="container">
        <section class="service-box">
            <h2>小S AI 溝通實戰</h2>
            <p>點擊右下角的小S頭像，立即開啟 1 分鐘模擬對話測驗！</p>
        </section>
    </div>

    <div class="ai-doll-trigger" id="openChat">
        <img src="service-s.png" alt="S">
    </div>

    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <div><strong>小S 顧問</strong> <button class="restart-btn" onclick="window.location.reload()">重新挑戰</button></div>
            <div id="timer" style="font-family: monospace;">01:00</div>
            <span id="closeChat" style="cursor:pointer; font-size: 20px;">✕</span>
        </div>

        <div id="chatMsgs" class="chat-messages">
            <div class="msg ai" id="startMsg">
                你好！我是小S。請選擇一個性格開始 1 分鐘實戰：
                <div class="mode-container" id="modeSelector">
                    <button class="mode-btn" onclick="initTest('👦 冷酷男孩')">👦 冷酷男孩</button>
                    <button class="mode-btn" onclick="initTest('👧 可愛女孩')">👧 可愛女孩</button>
                    <button class="mode-btn" onclick="initTest('😡 憤怒主管')">😡 憤怒主管</button>
                    <button class="mode-btn" onclick="initTest('😭 情緒化伴侶')">😭 情緒化伴侶</button>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="請先選擇模式..." disabled autocomplete="off">
            <button id="sendBtn" class="send-btn" disabled>➤</button>
        </div>

        <div class="assessment-overlay" id="reportView">
            <h2>測驗結束！</h2>
            <div style="font-size: 3rem; color: var(--accent-blue); font-weight: bold; margin: 15px 0;">8.5/10</div>
            <p>你的溝通很有溫度，但在應對「情緒化」場景時可以更堅定一點。</p>
            <input type="email" id="userEmail" placeholder="輸入 Email 獲取完整報告" style="width:90%; padding:12px; margin:15px 0; border:1px solid #ddd; border-radius:8px;">
            <button class="restart-btn" style="background:var(--accent-blue); padding:10px 25px; font-size:1rem;" onclick="window.location.reload()">送出並關閉</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMsgs = document.getElementById('chatMsgs');
        const modeSelector = document.getElementById('modeSelector');
        let timerId = null;
        let secondsLeft = 60;
        let currentMode = "";

        // 打開與關閉
        document.getElementById('openChat').onclick = () => chatWindow.style.display = 'flex';
        document.getElementById('closeChat').onclick = () => chatWindow.style.display = 'none';

        function initTest(mode) {
            currentMode = mode;
            // 鎖定選擇
            modeSelector.style.pointerEvents = 'none';
            modeSelector.style.opacity = '0.4';
            
            // 解鎖輸入
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.placeholder = "請輸入訊息...";
            
            // 強制聚焦（手機端關鍵）
            setTimeout(() => {
                userInput.focus();
                userInput.click();
            }, 300);

            addMsg(`系統：已進入 ${mode} 模式。請開始對話！`, 'ai');
            startTimer();
        }

        function startTimer() {
            if(timerId) return;
            timerId = setInterval(() => {
                secondsLeft--;
                let m = Math.floor(secondsLeft / 60);
                let s = secondsLeft % 60;
                document.getElementById('timer').textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                if(secondsLeft <= 0) {
                    clearInterval(timerId);
                    document.getElementById('reportView').style.display = 'flex';
                }
            }, 1000);
        }

        function addMsg(text, side) {
            const d = document.createElement('div');
            d.className = `msg ${side}`;
            d.textContent = text;
            chatMsgs.appendChild(d);
            chatMsgs.scrollTop = chatMsgs.scrollHeight;
        }

        function handleSend() {
            const val = userInput.value.trim();
            if(!val) return;
            addMsg(val, 'user');
            userInput.value = "";

            // 模擬對話回覆
            setTimeout(() => {
                let reply = "（小S 思考中...）";
                if(currentMode.includes("主管")) reply = "你覺得這份計畫真的可行嗎？我沒看到重點。";
                else if(currentMode.includes("女孩")) reply = "你每次都這樣說，根本沒在聽我講話！";
                else reply = "所以呢？你想表達什麼？";
                addMsg(reply, 'ai');
            }, 800);
        }

        sendBtn.onclick = handleSend;
        userInput.onkeydown = (e) => { if(e.key === 'Enter') handleSend(); };
    </script>
</body>
</html>
