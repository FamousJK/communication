<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我們的服務 - JK 交流工作坊</title>
    <style>
        :root {
            --primary-navy: #2c3e50;
            --accent-blue: #3498db;
            --ai-orange: #f39c12;
            --dark-orange: #d35400;
            --ai-gradient: linear-gradient(135deg, #f39c12, #d35400);
            --bg-light: #f4f7f9;
        }

        body { font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; margin: 0; background: var(--bg-light); }

        /* --- 導覽與 Banner --- */
        .top-bar { background: var(--primary-navy); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; }
        .hero-banner { background: linear-gradient(rgba(44, 62, 80, 0.6), rgba(44, 62, 80, 0.6)); height: 130px; display: flex; justify-content: center; align-items: center; color: white; }
        .nav-container { background: white; border-bottom: 1px solid #e1e8ed; sticky; top: 0; z-index: 1000; display: flex; justify-content: center; }
        .nav-links { display: flex; list-style: none; gap: 20px; padding: 0; }
        .nav-links a { text-decoration: none; color: var(--primary-navy); font-weight: bold; padding: 15px 10px; display: block; }

        /* --- AI 聊天視窗樣式 --- */
        .ai-doll-trigger { 
            position: fixed; bottom: 20px; right: 20px; width: 80px; height: 80px; z-index: 2000; cursor: pointer;
            animation: orange-glow 2s infinite ease-in-out; border-radius: 50%;
        }
        @keyframes orange-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(243, 156, 18, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 25px rgba(243, 156, 18, 0.8); transform: scale(1.05); }
        }
        .ai-doll-trigger img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid white; background: var(--ai-orange); }

        .chat-window { 
            position: fixed; bottom: 110px; right: 20px; width: 350px; height: 550px; 
            background: white; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.2); 
            display: none; flex-direction: column; z-index: 2100; overflow: hidden; 
        }

        .chat-header { background: var(--ai-gradient); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .timer-tag { background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 10px; font-size: 0.9rem; }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: #f8f9fa; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; }
        .msg.ai { background: white; align-self: flex-start; border: 1px solid #eee; color: #333; }
        .msg.user { background: var(--ai-orange); color: white; align-self: flex-end; }

        .chat-input-area { padding: 12px; border-top: 1px solid #eee; display: flex; gap: 8px; background: white; }
        .chat-input-area input { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .send-btn { background: var(--ai-orange); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        
        /* 響應式：手機全螢幕 */
        @media (max-width: 768px) {
            .chat-window { width: 100%; height: 100%; bottom: 0; right: 0; border-radius: 0; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div style="color:white; font-weight:bold;">JK 工作坊</div>
        <div style="color:white; font-size:12px;">FB | IG | YT</div>
    </div>

    <header class="hero-banner">
        <h1>我們的服務</h1>
    </header>

    <nav class="nav-container">
        <ul class="nav-links">
            <li><a href="#">主頁</a></li>
            <li><a href="#" class="active">我們的服務</a></li>
            <li><a href="#">聯絡我們</a></li>
        </ul>
    </nav>

    <div class="ai-doll-trigger" id="dollTrigger">
        <img src="service-s.png" alt="S">
    </div>

    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <span>小S | 實戰挑戰</span>
            <div id="timerDisplay" class="timer-tag">120s</div>
            <span id="closeChat" style="cursor:pointer; font-size: 20px;">✕</span>
        </div>

        <div id="key-auth-area" style="background: #fff3cd; padding: 10px; font-size: 0.8rem; border-bottom: 1px solid #ffeeba;">
            <div style="display: flex; gap: 5px;">
                <input type="password" id="temp-key" placeholder="貼入 Groq API Key..." style="flex: 1; padding: 5px;">
                <button onclick="saveKey()" style="padding: 5px 10px; background: #856404; color: white; border: none; cursor: pointer;">啟動</button>
            </div>
        </div>

        <div id="chatMsgs" class="chat-messages">
            <div class="msg ai">
                <b>【2分鐘實戰挑戰】</b><br><br>
                1. 貼入 API Key 並啟動<br>
                2. <b>輸入「開始」即可啟動挑戰！</b>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="請先啟動..." disabled>
            <button class="send-btn" id="sendBtn" disabled>➤</button>
        </div>
    </div>

    <script>
        // --- 1. 配置與數據 ---
        const topicBuckets = {
            "人際關係": ["你玩交友 App 很久了嗎？", "我很怕無聊的，你會怕囉嗦的女生嗎？", "你會有很多女生的朋友嗎？"],
            "工作": ["你從事什麼樣的工作呀？", "平時上班都是挺忙的。你上班會忙嗎？"],
            "生活": ["你喜歡去旅行嗎？", "你喜歡吃東西嗎？", "你喜歡聽音樂嗎？"]
        };

        let bucketOrder = ["人際關係", "工作", "生活"];
        let currentBucketIdx = 0;
        let currentQuestionIdx = 0;
        let state = "READY"; 
        let conversationHistory = [];
        let timeLeft = 120;
        let timerId = null;

        // --- 2. 視窗控制 ---
        const chatWindow = document.getElementById('chatWindow');
        const dollTrigger = document.getElementById('dollTrigger');
        const closeChat = document.getElementById('closeChat');

        dollTrigger.onclick = () => { chatWindow.style.display = 'flex'; };
        closeChat.onclick = () => { chatWindow.style.display = 'none'; };

        // --- 3. API Key 驗證 ---
        window.saveKey = function() {
            const key = document.getElementById('temp-key').value.trim();
            if (key.startsWith('gsk_')) {
                sessionStorage.setItem('GROQ_KEY', key);
                document.getElementById('key-auth-area').style.display = 'none';
                document.getElementById('chatInput').disabled = false;
                document.getElementById('chatInput').placeholder = "輸入「開始」...";
                document.getElementById('sendBtn').disabled = false;
                addMessage("系統：連線成功！現在請輸入「開始」來展開對話。", "ai");
            } else {
                alert('Key 格式不正確');
            }
        };

        // --- 4. 對話邏輯 ---
        async function handleSend() {
            const input = document.getElementById('chatInput');
            const val = input.value.trim();
            if (!val) return;

            if (state === "READY" && val === "開始") {
                state = "CHALLENGING";
                addMessage(val, 'user');
                startTimer();
                addMessage(`嗨，你好，我叫小S。很高興認識你！${topicBuckets["人際關係"][0]}`, 'ai');
                input.value = '';
                return;
            }

            addMessage(val, 'user');
            input.value = '';
            
            const apiKey = sessionStorage.getItem('GROQ_KEY');
            try {
                // 邏輯：準備下一題
                let nextTopic = bucketOrder[currentBucketIdx];
                let nextQuestion = topicBuckets[nextTopic][currentQuestionIdx + 1];
                let isTransition = false;

                if (!nextQuestion) {
                    currentBucketIdx++;
                    currentQuestionIdx = 0;
                    if (currentBucketIdx < bucketOrder.length) {
                        nextQuestion = topicBuckets[bucketOrder[currentBucketIdx]][0];
                        isTransition = true;
                    }
                } else {
                    currentQuestionIdx++;
                }

                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: `你是傲嬌少女小S。回應豐富（40-80字）。目前在聊【${nextTopic}】。規則：70%機率引出下一題『${nextQuestion || "結尾"}』，30%機率不提問只回饋（標記[SILENCE]）。若用戶邀約且話題連貫則答應。` },
                            ...conversationHistory.slice(-6)
                        ]
                    })
                });

                const data = await res.json();
                let aiMsg = data.choices[0].message.content;

                // 隨機留白邏輯
                if (Math.random() < 0.3 && !isTransition && nextQuestion) {
                    aiMsg = aiMsg.replace(/\[.*?\]/g, '').split('？')[0] + "。";
                    currentQuestionIdx--; 
                }

                addMessage(aiMsg.replace(/\[.*?\]/g, '').trim(), 'ai');
                if (currentBucketIdx >= bucketOrder.length && !nextQuestion) setTimeout(endChallenge, 3000);

            } catch (e) { addMessage("❌ 訊號不穩，等我一下喔！", "ai"); }
        }

        // --- 5. 輔助功能 ---
        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerHTML = text;
            const container = document.getElementById('chatMsgs');
            container.appendChild(div);
            container.scrollTo(0, container.scrollHeight);
            conversationHistory.push({ role: role === 'user' ? 'user' : 'assistant', content: text });
        }

        function startTimer() {
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = timeLeft + 's';
                if (timeLeft <= 0) endChallenge();
            }, 1000);
        }

        function endChallenge() {
            clearInterval(timerId);
            state = "FINISHED";
            document.getElementById('chatInput').disabled = true;
            addMessage("🚨 挑戰結束！感謝你的參與。", "ai");
        }

        document.getElementById('sendBtn').onclick = handleSend;
        document.getElementById('chatInput').onkeydown = (e) => { if(e.key === 'Enter') handleSend(); };
    </script>
</body>
</html>
