<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>我們的服務 - JK 交流工作坊</title>
    <style>
        :root {
            --primary-navy: #2c3e50;
            --accent-blue: #3498db;
            --soft-blue: #f0f7ff;
            --success-green: #27ae60;
            --ai-orange: #f39c12;
            --ai-gradient: linear-gradient(135deg, #3498db, #27ae60);
            --warm-bg: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            --text-dark: #333;
            --bg-light: #f9f9f9;
        }

        body { 
            font-family: 'Segoe UI', "Microsoft JhengHei", Arial, sans-serif; 
            line-height: 1.6; color: var(--text-dark); margin: 0; padding: 0; 
            background: var(--bg-light); overflow-x: hidden; 
        }

        /* --- SYNCED TOP BAR --- */
        .top-bar { 
            background: var(--primary-navy); 
            padding: 8px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            min-height: 45px;
        }
        .logo-container img { height: 30px; width: auto; display: block; }
        .top-bar-links a { color: white; text-decoration: none; margin-left: 15px; font-size: 14px; opacity: 0.8; }

        /* --- SYNCED HERO BANNER --- */
        .hero-banner {
            background: linear-gradient(rgba(44, 62, 80, 0.8), rgba(44, 62, 80, 0.8)), url('service-banner.jpg');
            background-size: cover; 
            background-position: center 30%; 
            height: 180px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: white;
            text-align: center;
        }
        .hero-banner h1 { font-size: 2.2rem; margin: 0; padding: 0 20px; font-weight: bold; }

        /* --- SYNCED NAVIGATION --- */
        .nav-container { background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 1000; }
        .nav-links { display: flex; list-style: none; gap: 25px; margin: 0; padding: 15px 20px; justify-content: center; }
        .nav-links li { position: relative; }
        .nav-links a { text-decoration: none; color: var(--primary-navy); font-weight: bold; font-size: 1.1rem; white-space: nowrap; display: block; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-blue); }

        /* Dropdown Desktop */
        .dropdown-content {
            display: none; position: absolute; background-color: white; min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1); z-index: 1001; border-radius: 8px; 
            top: 100%; left: 50%; transform: translateX(-50%);
            border-top: 3px solid var(--accent-blue);
        }
        .dropdown-content a { color: var(--primary-navy) !important; padding: 12px 16px; display: block; font-size: 1rem !important; font-weight: normal; text-align: center; border-bottom: none !important; }
        .dropdown-content a:hover { background-color: var(--soft-blue); }

        /* --- DESKTOP IMPROVEMENTS --- */
        @media (min-width: 769px) {
            .hero-banner { height: 250px; }
            .hero-banner h1 { font-size: 3.5rem; }
            .nav-links { gap: 40px; }
            .nav-links a { font-size: 1.3rem; }
            .dropdown:hover .dropdown-content { display: block; }

            /* Desktop Grid Layout for Services */
            .services-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 30px;
            }
            .full-width { grid-column: 1 / span 2; }
            
            .service-box {
                transition: transform 0.3s ease, box-shadow 0.3s ease;
                display: flex;
                flex-direction: column;
            }
            .service-box:hover {
                transform: translateY(-5px);
                box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            }

            .step-container-desktop {
                display: flex;
                gap: 20px;
                align-items: flex-start;
            }
            .step-item { flex: 1; }
        }

        /* Mobile Nav Adjustments */
        @media (max-width: 768px) {
            .nav-container { overflow-x: auto; }
            .nav-links { justify-content: flex-start; padding-right: 50px; }
            .dropdown.mobile-open .dropdown-content { 
                display: block; position: static; transform: none; box-shadow: none; 
                background: #fcfcfc; width: auto; min-width: 0; margin-top: 5px;
            }
            .dropdown.mobile-open .dropdown-content a { text-align: left; padding: 10px 15px; color: var(--accent-blue) !important; font-weight: bold; }
        }

        /* --- SERVICE PAGE CONTENT STYLE --- */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
        .service-box { background: white; padding: 25px; border-radius: 18px; border-left: 6px solid var(--accent-blue); margin-bottom: 35px; box-shadow: 0 5px 20px rgba(0,0,0,0.06); }
        .service-box h2 { color: var(--primary-navy); font-size: 1.6rem; font-weight: 900; margin-bottom: 25px; border-bottom: 3px solid var(--accent-blue); display: inline-block; }

        .step-header { display: flex; align-items: center; gap: 12px; margin-top: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .step-badge { background-color: var(--primary-navy); color: white; padding: 8px 16px; border-radius: 6px; font-size: 1rem; font-weight: 900; box-shadow: 4px 4px 0px var(--accent-blue); }
        .step-badge-b { background-color: var(--success-green); color: white; padding: 8px 16px; border-radius: 6px; font-size: 1rem; font-weight: 900; box-shadow: 4px 4px 0px var(--primary-navy); }
        .step-title-text { margin: 0; color: var(--primary-navy); font-size: 1.25rem; font-weight: 900; }

        .glow-s { color: var(--ai-orange); text-shadow: 0 0 12px rgba(243, 156, 18, 0.7); font-weight: 900; }

        .ai-highlight-box { background: white; padding: 20px; border-radius: 15px; margin-top: 25px; border: 2px solid var(--ai-orange); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        .skill-item { background: #fcfcfc; padding: 20px; border-radius: 15px; border: 1.5px solid #eee; margin-bottom: 15px; }
        .skill-item h4 { color: var(--accent-blue); font-size: 1.4rem; font-weight: 900; margin: 0 0 10px 0; }

        .btn { display: inline-block; padding: 15px 35px; text-decoration: none; border-radius: 12px; font-weight: 800; font-size: 1.1rem; text-align: center; border: none; cursor: pointer; transition: 0.3s; width: 100%; box-sizing: border-box; }

        /* Back Button - Synced */
        .back-btn-container { text-align: center; margin: 60px 0; }
        .back-btn { display: inline-block; padding: 12px 50px; background: var(--primary-navy); color: white; text-decoration: none; border-radius: 50px; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { background: var(--accent-blue); transform: translateY(-2px); }

        /* --- AI CHAT INTERFACE --- */
        .ai-doll-trigger { position: fixed; bottom: 20px; right: 20px; width: 90px; height: 90px; z-index: 2000; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .ai-doll-trigger::before { content: ''; position: absolute; width: 100%; height: 100%; background-color: var(--ai-orange); border-radius: 50%; opacity: 0.6; animation: orange-grow 2s infinite ease-out; z-index: -1; }
        @keyframes orange-grow { 0% { transform: scale(0.8); opacity: 0.8; } 100% { transform: scale(1.6); opacity: 0; } }
        .ai-doll-trigger img { width: 80px; height: 80px; border-radius: 50%; border: 4px solid white; background: var(--warm-bg); object-fit: contain; padding: 8px; box-sizing: border-box; }

        .chat-window { position: fixed; bottom: 120px; right: 20px; width: 360px; height: 70vh; max-height: 550px; background: white; border-radius: 25px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); display: none; flex-direction: column; z-index: 2100; overflow: hidden; }
        @media (max-width: 600px) { .chat-window { width: 100%; height: 100%; bottom: 0; right: 0; border-radius: 0; z-index: 9999; } }
        
        .chat-header { background: var(--ai-gradient); color: white; padding: 18px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: #f8f9fa; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 10px 15px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; }
        .msg.ai { background: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg.user { background: var(--accent-blue); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }

        .chat-input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 8px; background: white; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .send-btn { background: var(--accent-blue); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }

        .report-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:white; z-index:100; display:none; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center; box-sizing: border-box; }
        .score-box { font-size: 4.5rem; font-weight: 900; color: #333; margin: 20px 0; }
    </style>
</head>
