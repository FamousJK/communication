<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我們的服務 - JK 交流工作坊</title>
    <style>
        :root {
            --primary-navy: #2c3e50;
            --accent-blue: #3498db;
            --soft-blue: #f0f7ff;
            --ai-orange: #f39c12;
            --dark-orange: #d35400;
            --text-dark: #333;
        }

        body { font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; margin: 0; padding: 0; background: #f4f7f9; }

        /* Banner & Nav */
        .top-bar { background: var(--primary-navy); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo-container { color: white; font-weight: bold; }
        
        .hero-banner {
            background: linear-gradient(rgba(44, 62, 80, 0.6), rgba(44, 62, 80, 0.6)), url('your-bg.jpg');
            background-size: cover; background-position: center; 
            height: 180px; display: flex; justify-content: center; align-items: center; color: white;
        }
        .hero-banner h1 { font-size: 2.5rem; margin: 0; }

        .nav-container { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
        .nav-links { display: flex; list-style: none; justify-content: center; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: var(--primary-navy); padding: 15px 25px; display: block; font-weight: bold; }
        .nav-links a.active { color: var(--accent-blue); border-bottom: 3px solid var(--accent-blue); }

        /* Layout */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .service-box { margin-bottom: 50px; }
        .service-box h2 { font-size: 2rem; border-bottom: 3px solid var(--accent-blue); display: inline-block; margin-bottom: 30px; }
        
        .step-row { display: flex; gap: 20px; }
        .step-card { 
            flex: 1; background: white; padding: 30px; border-radius: 15px; 
            border: 2px solid #e0e0e0; position: relative; transition: 0.3s;
        }
        .step-card.blue { border-color: var(--accent-blue); }
        .step-card.orange { border-color: var(--ai-orange); }
        
        .badge { color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; margin-right: 10px; font-size: 0.8rem; }
        .badge-blue { background: var(--primary-navy); }
        .badge-orange { background: var(--dark-orange); }

        .btn { 
            display: block; width: 100%; padding: 12px; text-align: center; 
            text-decoration: none; border-radius: 10px; font-weight: bold; margin-top: 20px;
        }
        .btn-blue { background: var(--accent-blue); color: white; }
        .btn-orange { background: var(--ai-orange); color: white; }

        /* 1v1 Section */
        .full-card { 
            background: white; border: 2px solid var(--accent-blue); border-radius: 15px; 
            padding: 40px; text-align: center; 
        }

        /* AI Chat Window */
        .ai-doll-trigger { position: fixed; bottom: 30px; right: 30px; cursor: pointer; z-index: 2000; }
        .ai-doll-trigger img { width: 80px; height: 80px; border-radius: 50%; border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        .chat-window { 
            position: fixed; bottom: 120px; right: 30px; width: 350px; height: 550px; 
            background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
            display: none; flex-direction: column; overflow: hidden; z-index: 2100;
        }
        .chat-header { background: linear-gradient(to right, #f39c12, #d35400); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: #fdfdfd; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; }
        .msg.ai { background: white; border: 1px solid #eee; align-self: flex-start; }
        .msg.user { background: var(--ai-orange); color: white; align-self: flex-end; }
        
        .chat-input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; }

        @media (max-width: 768px) { .step-row { flex-direction: column; } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-container">JK 交流工作坊</div>
    </div>

    <section class="hero-banner">
        <h1>我們的服務</h1>
    </section>

    <nav class="nav-container">
        <div class="nav-links">
            <a href="#">主頁</a>
            <a href="#" class="active">我們的服務</a>
            <a href="#">聯絡我們</a>
        </div>
    </nav>

    <div class="container">
        <section class="service-box">
            <h2>1. MBTI 性格與 AI 諮詢</h2>
            <div class="step-row">
                <div class="step-card blue">
                    <span class="badge badge-blue">STEP A</span><h3 style="display:inline;">獲取性格報告</h3>
                    <p>透過專業測試了解你的溝通偏好。</p>
                    <a href="https://www.16personalities.com/ch" class="btn btn-blue">前往測試</a>
                </div>
                <div class="step-card orange">
                    <span class="badge badge-orange">STEP B</span><h3 style="display:inline;">AI 小S 實戰</h3>
                    <p>在模擬對話中磨練臨場反應。點擊右下角圖示開始。</p>
                    <div class="btn btn-orange">點擊右下角圖示 ↑</div>
                </div>
            </div>
        </section>

        <section class="service-box">
            <h2>2. 1對1 深度諮詢</h2>
            <div class="full-card">
                <p>針對職場談判、情感化解等高難度場景。</p>
                <a href="#" class="btn btn-blue" style="width: 200px; margin: 20px auto;">預約 JK 老師</a>
            </div>
        </section>
    </div>

    <div class="ai-doll-trigger" id="openChat">
        <img src="service-s.png" alt="S">
    </div>

    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <span>小S | **2分鐘** 實戰挑戰</span>
            <span id="timerDisplay" style="background:rgba(0,0,0,0.2); padding:2px 8px; border-radius:10px;">120s</span>
            <span id="closeChat" style="cursor:pointer;">✕</span>
        </div>
        
        <div id="key-area" style="padding:10px; background:#fff3cd; font-size:0.8rem;">
            <input type="password" id="apiKey" placeholder="貼入 Groq API Key..." style="width:70%;">
            <button onclick="activateChat()" style="background:#856404; color:white; border:none; padding:5px; border-radius:4px;">啟動</button>
        </div>

        <div id="chatMsgs" class="chat-messages">
            <div class="msg ai">輸入「開始」啟動挑戰！</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="請先啟動..." disabled>
            <button id="sendBtn" style="border:none; background:none; font-size:1.5rem; cursor:pointer;" disabled>➤</button>
        </div>
    </div>

    <script>
        // Logic remains identical to previous working version, but IDs matched to the HTML above
        let state = "READY";
        let timeLeft = 120;
        let timerId = null;

        const chatWindow = document.getElementById('chatWindow');
        const openBtn = document.getElementById('openChat');
        const closeBtn = document.getElementById('closeChat');
        const input = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        openBtn.onclick = () => chatWindow.style.display = 'flex';
        closeBtn.onclick = () => chatWindow.style.display = 'none';

        window.activateChat = () => {
            const key = document.getElementById('apiKey').value;
            if(key.startsWith('gsk_')) {
                sessionStorage.setItem('GROQ_KEY', key);
                document.getElementById('key-area').style.display = 'none';
                input.disabled = false;
                sendBtn.disabled = false;
                input.placeholder = "輸入「開始」...";
            }
        };

        // ... (Remaining chat logic for handleSend, addMessage, and timer)
        async function handleSend() {
            const val = input.value.trim();
            if(!val) return;
            if(state === "READY" && val === "開始") {
                state = "CHALLENGE";
                startTimer();
                addMessage("嗨！我是小S，很高興認識你。你玩交友 App 很久了嗎？", 'ai');
                input.value = ""; return;
            }
            addMessage(val, 'user');
            input.value = "";
            // Mock AI call placeholder
            setTimeout(() => addMessage("那你覺得我這個人怎麼樣？", 'ai'), 1000);
        }

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerText = text;
            document.getElementById('chatMsgs').appendChild(div);
            document.getElementById('chatMsgs').scrollTo(0, 9999);
        }

        function startTimer() {
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = timeLeft + 's';
                if(timeLeft <= 0) { clearInterval(timerId); input.disabled = true; }
            }, 1000);
        }

        sendBtn.onclick = handleSend;
        input.onkeydown = (e) => { if(e.key === 'Enter') handleSend(); };
    </script>
</body>
</html>
