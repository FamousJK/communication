<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>我們的服務 - JK 交流工作坊</title>
    <style>
        :root {
            --primary-navy: #2c3e50;
            --accent-blue: #3498db;
            --ai-gradient: linear-gradient(135deg, #3498db, #27ae60);
            --warm-bg: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        body { 
            font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; 
            margin: 0; padding: 0; background: #f9f9f9; 
        }

        /* --- AI AGENT VISUAL FIXES --- */
        .ai-doll-trigger { 
            position: fixed; bottom: 20px; right: 20px; 
            width: 80px; height: 80px; z-index: 2000; 
        }
        .ai-doll-trigger img { 
            width: 100%; height: 100%; border-radius: 50%; 
            border: 4px solid white; box-shadow: 0 8px 25px rgba(0,0,0,0.25); 
            background: var(--warm-bg); object-fit: contain; padding: 8px; box-sizing: border-box; 
        }

        .chat-window {
            position: fixed; bottom: 110px; right: 20px; 
            width: 360px; height: 75vh; max-height: 600px;
            background: white; border-radius: 25px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: none; flex-direction: column; z-index: 2100; overflow: hidden;
        }

        @media (max-width: 600px) {
            .chat-window { width: 100%; height: 100%; bottom: 0; right: 0; border-radius: 0; z-index: 9999; }
        }

        /* STICKY HEADER: Keeps Timer Visible */
        .chat-header { 
            background: var(--ai-gradient); color: white; padding: 18px; 
            display: flex; justify-content: space-between; align-items: center; 
            font-weight: bold; position: sticky; top: 0; z-index: 10;
        }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: #f8f9fa; display: flex; flex-direction: column; gap: 12px; }
        
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 1rem; line-height: 1.4; }
        .msg.ai { background: white; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .msg.user { background: var(--accent-blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

        .chat-input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white; align-items: center; }
        .chat-input-area input { flex: 1; padding: 14px 20px; border: 2px solid #e0e0e0; border-radius: 30px; font-size: 16px; outline: none; }
        .send-btn { background: var(--accent-blue); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }

        /* FIXED ASSESSMENT OVERLAY ALIGNMENT */
        .assessment-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; z-index: 2200; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
            padding: 20px; text-align: center; box-sizing: border-box;
        }
        .assessment-overlay h2 { font-size: 1.8rem; font-weight: 900; color: var(--primary-navy); margin: 0 0 10px 0; }
        .score-box { font-size: 4rem; color: var(--accent-blue); font-weight: 900; margin: 10px 0; }
        .assessment-overlay p { margin: 10px 0; font-weight: 600; color: #555; max-width: 280px; }
        .assessment-overlay input { width: 90%; max-width: 300px; padding: 15px; margin: 15px 0; border: 2px solid #eee; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
        .btn-submit { background: var(--ai-gradient); color: white; border: none; padding: 15px 40px; border-radius: 10px; font-weight: 800; font-size: 1.1rem; cursor: pointer; width: 90%; max-width: 300px; }
    </style>
</head>
<body>

    <div class="ai-doll-trigger" id="openChat">
        <img src="service-s.png" alt="S">
    </div>

    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <div>小S 顧問 <button onclick="window.location.reload()" style="background:rgba(255,255,255,0.2); border:1px solid white; color:white; font-size:10px; border-radius:5px; padding:2px 8px; margin-left:10px;">重新挑戰</button></div>
            <div id="timer">00:30</div>
            <span id="closeChat" style="cursor:pointer; font-size: 24px;">✕</span>
        </div>
        <div id="chatMsgs" class="chat-messages">
            <div class="msg ai">
                你好！我是小S。點選下方模式開啟 30 秒實戰：
                <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:15px;" id="modeSelector">
                    <button class="mode-btn" onclick="initTest('👦 冷酷男孩')" style="background:white; border:2px solid var(--accent-blue); padding:8px 12px; border-radius:12px; font-weight:800; color:var(--accent-blue);">👦 冷酷男孩</button>
                    <button class="mode-btn" onclick="initTest('👧 可愛女孩')" style="background:white; border:2px solid var(--accent-blue); padding:8px 12px; border-radius:12px; font-weight:800; color:var(--accent-blue);">👧 可愛女孩</button>
                    <button class="mode-btn" onclick="initTest('😡 憤怒主管')" style="background:white; border:2px solid var(--accent-blue); padding:8px 12px; border-radius:12px; font-weight:800; color:var(--accent-blue);">😡 憤怒主管</button>
                    <button class="mode-btn" onclick="initTest('😭 情緒化伴侶')" style="background:white; border:2px solid var(--accent-blue); padding:8px 12px; border-radius:12px; font-weight:800; color:var(--accent-blue);">😭 情緒化伴侶</button>
                </div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="請先選擇模式..." disabled autocomplete="off">
            <button id="sendBtn" class="send-btn" disabled>➤</button>
        </div>

        <div class="assessment-overlay" id="reportView">
            <h2>測驗結束！</h2>
            <div class="score-box">8.5</div>
            <p>輸入 Email 獲取完整 1,000 字深度分析報告</p>
            <input type="email" id="userEmail" placeholder="your@email.com">
            <button class="btn-submit" onclick="window.location.reload()">送出並關閉</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMsgs = document.getElementById('chatMsgs');
        let timerId = null, secondsLeft = 30; // Updated to 30s

        document.getElementById('openChat').onclick = () => chatWindow.style.display = 'flex';
        document.getElementById('closeChat').onclick = () => chatWindow.style.display = 'none';

        function initTest(mode) {
            document.getElementById('modeSelector').style.opacity = '0.4';
            document.getElementById('modeSelector').style.pointerEvents = 'none';
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.placeholder = "請開始輸入...";
            setTimeout(() => { userInput.focus(); }, 300);
            addMsg(`系統：進入 ${mode} 模式。測驗開始！`, 'ai');
            startTimer();
        }

        function startTimer() {
            if(timerId) return;
            timerId = setInterval(() => {
                secondsLeft--;
                let m = Math.floor(secondsLeft / 60), s = secondsLeft % 60;
                document.getElementById('timer').textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                if(secondsLeft <= 0) { 
                    clearInterval(timerId); 
                    document.getElementById('reportView').style.display = 'flex'; 
                }
            }, 1000);
        }

        function addMsg(text, side) {
            const d = document.createElement('div');
            d.className = `msg ${side}`;
            d.textContent = text;
            chatMsgs.appendChild(d);
            chatMsgs.scrollTop = chatMsgs.scrollHeight;
        }

        function handleSend() {
            const val = userInput.value.trim();
            if(!val) return;
            addMsg(val, 'user');
            userInput.value = "";
            setTimeout(() => addMsg("這就是你的解決方案嗎？我看不出誠意。", 'ai'), 800);
        }

        sendBtn.onclick = handleSend;
        userInput.onkeydown = (e) => { if(e.key === 'Enter') handleSend(); };
    </script>
</body>
</html>
