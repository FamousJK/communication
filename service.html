<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我們的服務 - JK 交流工作坊</title>
    <style>
        :root {
            --primary-navy: #2c3e50;
            --accent-blue: #3498db;
            --ai-orange: #f39c12;
            --dark-orange: #d35400;
            --ai-gradient: linear-gradient(135deg, #f39c12, #d35400);
            --text-dark: #333;
            --bg-light: #f4f7f9;
        }

        body { font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; line-height: 1.6; color: var(--text-dark); margin: 0; padding: 0; background: var(--bg-light); }

        /* --- NAVIGATION & HERO (SYNCED POSITIONS) --- */
        .top-bar { background: var(--primary-navy); padding: 8px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo-container img { height: 30px; }
        .top-bar-links a { color: white; text-decoration: none; margin-left: 15px; font-size: 14px; opacity: 0.8; }

        .hero-banner {
            background: linear-gradient(rgba(44, 62, 80, 0.8), rgba(44, 62, 80, 0.8)), url('service-banner.jpg');
            background-size: cover; background-position: center; height: 180px; 
            display: flex; justify-content: center; align-items: center; color: white;
        }
        .hero-banner h1 { font-size: 2.2rem; font-weight: bold; }

        .nav-container { background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 1000; }
        .nav-links { display: flex; list-style: none; gap: 25px; margin: 0; padding: 15px 20px; justify-content: center; }
        .nav-links a { text-decoration: none; color: var(--primary-navy); font-weight: bold; font-size: 1.1rem; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-blue); }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .service-box { background: white; padding: 45px; border-radius: 15px; border-left: 5px solid var(--accent-blue); margin-bottom: 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .service-box h2 { color: var(--primary-navy); font-size: 1.8rem; border-bottom: 2px solid var(--accent-blue); display: inline-block; padding-bottom: 5px; }
        p { font-size: 1.2rem; line-height: 1.7; color: #555; }

        /* --- AI AGENT (ORANGE GLOW) --- */
        .ai-doll-trigger { 
            position: fixed; bottom: 20px; right: 20px; width: 90px; height: 90px; z-index: 2000; cursor: pointer;
            animation: orange-glow 2s infinite ease-in-out; border-radius: 50%;
        }
        @keyframes orange-glow {
            0% { box-shadow: 0 0 5px rgba(243, 156, 18, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(243, 156, 18, 0.9); transform: scale(1.08); }
            100% { box-shadow: 0 0 5px rgba(243, 156, 18, 0.4); transform: scale(1); }
        }
        .ai-doll-trigger img { width: 80px; height: 80px; border-radius: 50%; border: 4px solid white; background: white; padding: 5px; }

        .chat-window { position: fixed; bottom: 120px; right: 20px; width: 360px; height: 600px; background: white; border-radius: 25px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); display: none; flex-direction: column; z-index: 2100; overflow: hidden; }
        .chat-header { background: var(--ai-gradient); color: white; padding: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        .timer-tag { background: rgba(0,0,0,0.2); padding: 2px 10px; border-radius: 10px; font-family: monospace; }
        
        .style-bar { display: flex; padding: 10px; background: #fff; border-bottom: 1px solid #eee; justify-content: space-around; }
        .style-btn { border: 1px solid var(--ai-orange); background: none; color: var(--ai-orange); padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; }
        .style-btn.active { background: var(--ai-orange); color: white; }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: #f8f9fa; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 1rem; }
        .msg.ai { background: white; align-self: flex-start; border: 1px solid #eee; }
        .msg.user { background: var(--ai-orange); color: white; align-self: flex-end; }
        
        .chat-input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        .send-btn { background: var(--ai-orange); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }

        @media (min-width: 769px) {
            .hero-banner h1 { font-size: 3.5rem; }
            .nav-links a { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-container"><img src="logo.png" alt="Logo"></div>
        <div class="top-bar-links"><a href="#">FB</a><a href="#">IG</a><a href="#">YT</a></div>
    </div>

    <header class="hero-banner"><h1>我們的服務</h1></header>

    <nav class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html">主頁</a></li>
            <li><a href="service.html" class="active">我們的服務</a></li>
            <li><a href="issue.html">溝通問題</a></li>
            <li><a href="#">聯絡我們</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <section class="service-box">
            <h2>實戰模擬服務</h2>
            <p>透過 AI 顧問小S，您可以在高壓環境下練習對話技巧。請點擊右下角發光圖示開啟您的 30 秒實戰挑戰！</p>
        </section>
    </div>

    <div class="ai-doll-trigger" id="openChat"><img src="service-s.png" alt="S"></div>
    
    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <span>小S | 實戰挑戰</span>
            <div id="timer" class="timer-tag">30s</div>
            <span id="closeChat" style="cursor:pointer; font-size: 20px;">✕</span>
        </div>
        
        <div class="style-bar" id="styleBar">
            <button class="style-btn active" onclick="updateStyle('專業')">專業模式</button>
            <button class="style-btn" onclick="updateStyle('親和')">親和模式</button>
            <button class="style-btn" onclick="updateStyle('犀利')">犀利模式</button>
        </div>

        <div id="chatMsgs" class="chat-messages">
            <div class="msg ai">準備好開始 30 秒溝通挑戰了嗎？<br><br>請先選擇上方的「模式」，然後對我說「我準備好了」來啟動計時器！</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="輸入訊息...">
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const dollTrigger = document.getElementById('openChat');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMsgs = document.getElementById('chatMsgs');
        const timerTag = document.getElementById('timer');

        let timeLeft = 30;
        let timerRunning = false;
        let currentStyle = "專業";
        let state = "READY"; // READY, CHALLENGING, ASSESSMENT, EMAIL

        dollTrigger.onclick = () => { chatWindow.style.display = 'flex'; dollTrigger.style.display = 'none'; };
        document.getElementById('closeChat').onclick = () => { chatWindow.style.display = 'none'; dollTrigger.style.display = 'flex'; };

        function updateStyle(s) {
            currentStyle = s;
            document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function addMessage(text, side) {
            const div = document.createElement('div');
            div.className = `msg ${side}`;
            div.innerHTML = text;
            chatMsgs.appendChild(div);
            chatMsgs.scrollTop = chatMsgs.scrollHeight;
        }

        function handleSend() {
            const val = chatInput.value.trim();
            if(!val) return;
            addMessage(val, 'user');
            chatInput.value = '';

            if (state === "READY") {
                state = "CHALLENGING";
                startTimer();
                addMessage(`【${currentStyle}模式已啟動】<br>好的！假設我現在是你生氣的老闆，你沒準時交報告，你要怎麼解釋？`, 'ai');
            } 
            else if (state === "CHALLENGING") {
                chatInput.disabled = true;
                setTimeout(() => {
                    if(timeLeft > 0) {
                        addMessage("這聽起來像是在找藉口，你覺得這樣能解決問題嗎？", 'ai');
                        chatInput.disabled = false;
                        chatInput.focus();
                    }
                }, 800);
            }
            else if (state === "EMAIL") {
                addMessage("感謝！分析報告將於 24 小時內寄送到此信箱。祝您溝通順利！", 'ai');
                chatInput.disabled = true;
            }
        }

        function startTimer() {
            timerRunning = true;
            const id = setInterval(() => {
                timeLeft--;
                timerTag.innerText = timeLeft + 's';
                if (timeLeft <= 0) {
                    clearInterval(id);
                    endChallenge();
                }
            }, 1000);
        }

        function endChallenge() {
            state = "ASSESSMENT";
            chatInput.disabled = true;
            addMessage("🚨 <b>挑戰結束！</b><br>在剛才的對話中，你表現出高度的邏輯性，但同理心稍微不足。", 'ai');
            
            setTimeout(() => {
                addMessage("想要獲得完整的「溝通能力診斷報告」嗎？請在下方留下您的 <b>Email</b>，我會寄給您！", 'ai');
                state = "EMAIL";
                chatInput.disabled = false;
                chatInput.placeholder = "請輸入您的 Email...";
            }, 1500);
        }

        sendBtn.onclick = handleSend;
        chatInput.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };
    </script>
</body>
</html>
